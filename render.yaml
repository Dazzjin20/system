services:
  - type: web_service
    name: pet-adoption-backend
    env: node
    region: oregon
    branch: main
    root: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        value: ""
      - key: JWT_SECRET
        value: ""
      - key: FRONTEND_URL
        value: ""
      - key: NODE_ENV
        value: "production"
    healthCheckPath: /health
